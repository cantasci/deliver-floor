  spring-boot: ["ecc:springboot-patterns", "ecc:springboot-tdd", "ecc:springboot-security", "ecc:java-coding-standards"]
  java: ["ecc:java-coding-standards"]
  go: ["ecc:golang-patterns", "ecc:golang-testing"]
  golang: ["ecc:golang-patterns", "ecc:golang-testing"]
  typescript: ["ecc:backend-patterns", "ecc:tdd-workflow"]
  javascript: ["ecc:backend-patterns", "ecc:tdd-workflow"]
  node: ["ecc:backend-patterns", "ecc:tdd-workflow"]
  nestjs: ["ecc:nestjs-patterns", "ecc:tdd-workflow"]
  python: ["ecc:python-patterns", "ecc:python-testing"]
  django: ["ecc:django-patterns", "ecc:django-tdd", "ecc:django-security"]
  fastapi: ["ecc:fastapi-patterns", "ecc:python-testing"]
  kotlin: ["ecc:kotlin-patterns", "ecc:kotlin-testing"]
  android: ["ecc:android-clean-architecture", "ecc:kotlin-coroutines-flows", "ecc:kotlin-testing"]
  swift: ["ecc:swiftui-patterns", "ecc:swift-protocol-di-testing"]
  ios: ["ecc:swiftui-patterns", "ecc:swift-concurrency-6-2"]
  flutter: ["ecc:dart-flutter-patterns"]
  react: ["ecc:react-patterns", "ecc:react-testing"]
  react-native: ["ecc:react-native-patterns"]
  rust: ["ecc:rust-patterns", "ecc:rust-testing"]
  postgres: ["ecc:postgres-patterns", "ecc:database-migrations"]
  mysql: ["ecc:database-migrations"]
  docker: ["ecc:docker-patterns"]

# Stack detection hints (Michael checks these at intake)
stack_hints:
  package.json: "typescript/javascript — check dependencies for react/vue/next"
  tsconfig.json: typescript
  build.gradle / build.gradle.kts: "kotlin/java — mobile if the android plugin is applied"
  Package.swift / *.xcodeproj: swift (mobile)
  pubspec.yaml: flutter (mobile)
  pyproject.toml / requirements.txt: "python — check for django/fastapi"
  go.mod: go
  pom.xml / build.gradle with spring-boot: "java + spring-boot"
  Cargo.toml: rust
